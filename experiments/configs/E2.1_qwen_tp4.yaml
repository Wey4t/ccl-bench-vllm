experiment:
  name: "E2.1_qwen_tp4"
  description: "TP Control Group: Qwen 72B with TP=4"

model:
  name: "Qwen/Qwen2.5-32B"
  precision: "bfloat16"
  gpu_memory_utilization: 0.96
  enforce_eager: true

parallelism:
  tp: 4
  pp: 1
  dp_shard: 1

data:
  batch_size: 16
  seq_len: 2048
  max_tokens: 512

output_dir: "trace_collection/E2.1_qwen_tp4"
warmup_iterations: 2
profile_iterations: 3
