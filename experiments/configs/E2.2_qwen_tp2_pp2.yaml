experiment:
  name: "E2.2_qwen_tp2_pp2"
  description: "Hybrid Parallelism: Qwen 72B with TP=2, PP=2"

model:
  name: "Qwen/Qwen2.5-32B"
  precision: "bfloat16"
  gpu_memory_utilization: 0.96
  enforce_eager: true

parallelism:
  tp: 2
  pp: 2
  dp_shard: 1

data:
  batch_size: 16
  seq_len: 2048
  max_tokens: 512

output_dir: "trace_collection/E2.2_qwen_tp2_pp2"
warmup_iterations: 2
profile_iterations: 3
